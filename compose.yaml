services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: solar_designer
      POSTGRES_USER: solar_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar_app -d solar_designer"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:

