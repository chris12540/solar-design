<svg xmlns="http://www.w3.org/2000/svg" width="940" height="455" viewBox="0 0 940 455" role="img" aria-label="Ridge extent before and after"><title>Ridge extent before and after</title><rect width="940" height="455" rx="10" fill="#ffffff"/><g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#1f2933"><text x="470.0" y="30.0" font-size="17" text-anchor="middle" font-weight="600" fill="#1f2933">Ridges, hips and valleys: where a line should stop</text><polygon points="65.0,302.0 405.0,302.0 405.0,98.0 65.0,98.0" fill="#eef3f9" stroke="#1f2933" stroke-width="2"/><line x1="167.0" y1="200.0" x2="269.0" y2="98.0" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="303.0" y1="200.0" x2="201.0" y2="98.0" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="167.0" y1="200.0" x2="269.0" y2="302.0" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="303.0" y1="200.0" x2="201.0" y2="302.0" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="65.0" y1="302.0" x2="167.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="405.0" y1="302.0" x2="303.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="65.0" y1="98.0" x2="167.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="405.0" y1="98.0" x2="303.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="167.0" y1="200.0" x2="303.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><text x="235.0" y="336.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2933">Before: each plane intersection runs across the whole roof</text><polygon points="535.0,302.0 875.0,302.0 875.0,98.0 535.0,98.0" fill="#eef3f9" stroke="#1f2933" stroke-width="2"/><line x1="535.0" y1="302.0" x2="637.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="875.0" y1="302.0" x2="773.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="535.0" y1="98.0" x2="637.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="875.0" y1="98.0" x2="773.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><line x1="637.0" y1="200.0" x2="773.0" y2="200.0" stroke="#2b6cb0" stroke-width="2.5"/><text x="705.0" y="336.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2933">After: a line is kept only where its two faces meet</text><line x1="75" x2="95" y1="396" y2="396" stroke="#2b6cb0" stroke-width="2.5"/><text x="102.0" y="400.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">real ridge and hips</text><line x1="270" x2="290" y1="396" y2="396" stroke="#c53030" stroke-width="2.5" stroke-dasharray="6 4"/><text x="297.0" y="400.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1f2933">line carried past where the faces stop</text><text x="470.0" y="432.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6c7b">Illustration of a hip roof, not measured data. On the two real roofs, nearly every accepted line ran 10-22 m past the 3-8 m where its faces meet.</text></g></svg>