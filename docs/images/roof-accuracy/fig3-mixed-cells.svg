<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="Mixed cell before and after"><title>Mixed cell before and after</title><rect width="940" height="360" rx="10" fill="#ffffff"/><g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#1f2933"><text x="470.0" y="30.0" font-size="17" text-anchor="middle" font-weight="600" fill="#1f2933">A cell that straddles two faces</text><defs><pattern id="lost" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#dd6b20" stroke-width="3"/></pattern></defs><rect x="70.0" y="70" width="340" height="170" fill="#2b6cb0" fill-opacity=".55"/><rect x="274.0" y="70" width="136.0" height="170" fill="url(#lost)"/><rect x="70.0" y="70" width="340" height="170" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="274.0" x2="274.0" y1="70" y2="240" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/><text x="172.0" y="159.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">face A (56%)</text><rect x="294.0" y="143.0" width="96" height="22" rx="4" fill="#ffffff" fill-opacity=".85"/><text x="342.0" y="159.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">face B (42%)</text><text x="240.0" y="270.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2933">Before: the cell goes whole to one plane, so face B is given away</text><rect x="530.0" y="70" width="204.0" height="170" fill="#2b6cb0" fill-opacity=".55"/><rect x="734.0" y="70" width="136.0" height="170" fill="#dd6b20" fill-opacity=".55"/><rect x="530.0" y="70" width="340" height="170" fill="none" stroke="#1f2933" stroke-width="2"/><line x1="734.0" x2="734.0" y1="70" y2="240" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/><text x="632.0" y="159.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">face A (56%)</text><rect x="754.0" y="143.0" width="96" height="22" rx="4" fill="#ffffff" fill-opacity=".85"/><text x="802.0" y="159.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f2933">face B (42%)</text><text x="700.0" y="270.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2933">After: split by owner, each face keeps its own area</text><text x="470.0" y="326.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6c7b">Dashed line: the real boundary. Hatched: area handed to the wrong plane.</text><text x="470.0" y="344.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#5f6c7b">The shares are from the real defect that first showed this: a 27 m² cell, 56% one face and 42% a narrow 12 m² gable that came out facing the wrong way.</text></g></svg>